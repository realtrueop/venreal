name: Update venreal

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and rebuild
        run: |
          curl -sl "https://sub.vlessfo.ru/vlessforu/working_configs.txt" -o src.txt
          python3 << 'PY'
          import re
          from urllib.parse import unquote
          from collections import defaultdict

          with open('src.txt', 'r', encoding='utf-8', errors='replace') as f:
              lines = f.readlines()

          configs = [l.strip() for l in lines if l.strip().startswith(('vless://','vmess://','trojan://','ss://','hysteria2://','hy2://'))]

          flag_re = re.compile(r'[\U0001F1E0-\U0001F1FF]{2}')
          flag_names = {
              '🇷🇺': 'Россия', '🇩🇪': 'Германия', '🇳🇱': 'Нидерланды',
              '🇺🇸': 'США', '🇫🇷': 'Франция', '🇬🇧': 'Великобритания',
              '🇫🇮': 'Финляндия', '🇸🇪': 'Швеция', '🇹🇷': 'Турция',
              '🇯🇵': 'Япония', '🇰🇷': 'Корея', '🇨🇳': 'Китай',
              '🇭🇰': 'Гонконг', '🇸🇬': 'Сингапур', '🇦🇪': 'ОАЭ',
              '🇨🇭': 'Швейцария', '🇦🇹': 'Австрия', '🇵🇱': 'Польша',
              '🇨🇿': 'Чехия', '🇮🇹': 'Италия', '🇪🇸': 'Испания',
              '🇨🇦': 'Канада', '🇧🇷': 'Бразилия', '🇦🇺': 'Австралия',
              '🇮🇳': 'Индия', '🇮🇱': 'Израиль', '🇪🇪': 'Эстония',
              '🇱🇻': 'Латвия', '🇱🇹': 'Литва', '🇺🇦': 'Украина',
              '🇪🇺': 'LTE/5G Все операторы',
          }

          def extract_flag(r):
              f = flag_re.findall(r)
              return f[-1] if f else '🌐'

          counters = defaultdict(int)
          result = []
          for cfg in configs:
              if '#' in cfg:
                  base, remark = cfg.rsplit('#', 1)
                  try: decoded = unquote(remark)
                  except: decoded = remark
                  
                  flag = extract_flag(decoded)
                  counters[flag] += 1
                  
                  name = flag_names.get(flag, '')
                  
                  # Всегда берем название из списка flag_names, игнорируя оригинальное
                  if flag == '🌐' or flag == '🇪🇺':
                      label = f"{flag} LTE/5G Все операторы"
                  elif name:
                      label = f"{flag} {name}"
                  else:
                      label = f"{flag}"
                  
                  result.append(f"{base}#{label}")
              else:
                  counters['🌐'] += 1
                  result.append(f"{cfg}#LTE/5G Все операторы")

          header = f"""#profile-title: venreal
          #announce: 🔥 Серверов: {len(result)} | мулловский впн | ⚡ Белые списки
          #profile-update-interval: 12
          #subscription-userinfo: upload=0; download=0; total=732274744098816; expire=148174070400
          """
          with open('venreal.txt', 'w', encoding='utf-8') as f:
              f.write(header)
              f.write('\n'.join(result) + '\n')
          print(f'Updated: {len(result)} servers')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add venreal.txt
          git diff --staged --quiet || git commit -m "auto update"
          git push
